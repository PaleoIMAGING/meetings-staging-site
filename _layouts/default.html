<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} | {% endif %}PaleoIMAGING</title>
{% if page.noindex %}  <meta name="robots" content="noindex, nofollow">
{% endif %}  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="icon" href="{{ '/assets/favicons/favicon.ico' | relative_url }}" sizes="any">
  <link rel="icon" type="image/png" sizes="48x48" href="{{ '/assets/favicons/favicon-48x48.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/favicons/favicon-32x32.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/favicons/favicon-16x16.png' | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/favicons/apple-touch-icon.png' | relative_url }}">
  <link rel="manifest" href="{{ '/assets/favicons/site.webmanifest' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>
  <header class="site-header">
    <div class="wrap site-header__inner">
      <a class="brand" href="{{ '/' | relative_url }}">
        <img src="{{ '/assets/images/PaleoIMAGING_logo.png' | relative_url }}" alt="PaleoIMAGING">
      </a>
      <nav aria-label="Main">
        <ul>
          <li><a href="{{ '/' | relative_url }}">Home</a></li>
          <li><a href="{{ '/meetings/' | relative_url }}"{% if page.url contains '/meetings/' %} aria-current="page"{% endif %}>Meetings</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="content" class="wrap">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>PaleoIMAGING is a Working Group of <a href="https://pastglobalchanges.org/">PAGES</a>.</p>
    </div>
  </footer>
</body>
</html>
